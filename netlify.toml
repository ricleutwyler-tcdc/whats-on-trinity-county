# Static site — the published file is index.html at the repo root.
# No build step: the weekly generator commits a rebuilt index.html and Netlify publishes it.
[build]
  publish = "."
  command = ""

# events.json is a public copy of what the page already shows, for other TCDC sites
# (the Revitalization Hub). Any site may read it; keep the cache short so updates show up.
[[headers]]
  for = "/events.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=900"
    Content-Type = "application/json; charset=utf-8"

# The repo root is the publish folder, so the generator, runbooks and notes would otherwise
# be public pages. They're for Claude and the weekly build, not visitors: answer 404.
[[redirects]]
  from = "/generator/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/_to_delete/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404
  force = true
